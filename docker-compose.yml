services:
  mysql:
    image: mysql:8.0
    container_name: ll-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: locallife
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      # 首次启动会自动执行 sql/ 下的建表脚本
      - ./sql:/docker-entrypoint-initdb.d
      - ll-mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: ll-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ll-redis-data:/data

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ll-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理台 http://localhost:15672

volumes:
  ll-mysql-data:
  ll-redis-data:
